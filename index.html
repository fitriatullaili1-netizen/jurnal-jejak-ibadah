<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JEJAK IBADAH SANTRI</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #eaf7f0;
      padding: 15px;
      margin: 0;
    }

    h2 {
      color: #198754;
      margin-bottom: 5px;
    }

    p {
      color: #555;
    }

    select {
      width: 90%;
      max-width: 400px;
      padding: 12px;
      font-size: 17px;
      margin: 15px auto;
      border-radius: 8px;
      border: 1px solid #ccc;
      display: block;
      background: white;
    }

    button {
      width: 90%;
      max-width: 400px;
      padding: 14px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px auto;
      background: #198754;
      color: white;
    }

    #berhenti {
      background: #dc3545;
      display: none;
    }

    #reader {
      width: 100%;
      max-width: 450px;
      margin: 15px auto;
      background: white;
      border-radius: 10px;
    }

    #hasil {
      margin: 15px auto;
      padding: 15px;
      max-width: 400px;
      background: white;
      border-radius: 10px;
      font-weight: bold;
      line-height: 1.6;
    }

    .berhasil {
      color: #198754;
    }

    .gagal {
      color: #dc3545;
    }
  </style>
</head>

<body>

  <h2>📖 JEJAK IBADAH SANTRI</h2>

  <p>Silakan pilih ibadah kemudian scan QR Code santri</p>

  <select id="sholat">
    <option value="DHUHA">DHUHA</option>
    <option value="DHUHUR">DHUHUR</option>
  </select>

  <button id="mulai" onclick="mulaiScan()">
    📷 MULAI SCAN
  </button>

  <button id="berhenti" onclick="berhentiScan()">
    ⛔ BERHENTI
  </button>

  <div id="reader"></div>

  <div id="hasil">
    Tekan MULAI SCAN untuk menggunakan kamera.
  </div>

  <script>

    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycby7QLnTMiKPmGd6irdYazWhShWlkuvmR42zj_UlO0ltYTk7KqYgY-4BJx0JOllwSY5KrA/exec";

    let scanner = null;
    let sedangScan = false;
    let kameraAktif = false;


    async function mulaiScan() {

      if (kameraAktif) {
        return;
      }

      document.getElementById("hasil").innerHTML =
        "⏳ Meminta izin kamera...";

      try {

        scanner = new Html5Qrcode("reader");

        await scanner.start(
          {
            facingMode: "environment"
          },
          {
            fps: 10,
            qrbox: {
              width: 250,
              height: 250
            }
          },
          berhasilScan,
          gagalScan
        );

        kameraAktif = true;

        document.getElementById("mulai").style.display =
          "none";

        document.getElementById("berhenti").style.display =
          "block";

        document.getElementById("hasil").innerHTML =
          "📷 <b>Kamera siap.</b><br>Arahkan ke QR santri.";

      } catch (error) {

        console.log(error);

        document.getElementById("hasil").innerHTML =
          "<div class='gagal'>" +
          "❌ Kamera tidak bisa dibuka.<br><br>" +
          "Pastikan izin kamera sudah diberikan." +
          "</div>";
      }
    }


    function berhasilScan(id) {

      if (sedangScan) {
        return;
      }

      sedangScan = true;

      id = String(id).trim();

      const sholat =
        document.getElementById("sholat").value;

      document.getElementById("hasil").innerHTML =
        "⏳ Memproses ID <b>" +
        id +
        "</b>...";


      const url =
        SCRIPT_URL +
        "?id=" +
        encodeURIComponent(id) +
        "&sholat=" +
        encodeURIComponent(sholat) +
        "&t=" +
        Date.now();


      fetch(url, {
        method: "GET",
        mode: "no-cors",
        cache: "no-store"
      })

      .then(function() {

        document.getElementById("hasil").innerHTML =
          "<div class='berhasil'>" +
          "✅ <b>DATA TERKIRIM</b>" +
          "<br><br>" +
          "ID: " + id +
          "<br>" +
          "Ibadah: " + sholat +
          "<br><br>" +
          "Data sedang dicatat ke Google Sheet." +
          "</div>";

        setTimeout(function() {

          sedangScan = false;

          document.getElementById("hasil").innerHTML =
            "📷 Silakan scan QR santri berikutnya.";

        }, 3000);

      })

      .catch(function(error) {

        console.log(error);

        document.getElementById("hasil").innerHTML =
          "<div class='gagal'>" +
          "❌ <b>GAGAL MENGIRIM DATA</b>" +
          "<br><br>" +
          "Periksa koneksi internet." +
          "</div>";

        sedangScan = false;
      });
    }


    function gagalScan(error) {
      // Kamera tetap mencari QR
    }


    async function berhentiScan() {

      if (!scanner || !kameraAktif) {
        return;
      }

      try {

        await scanner.stop();
        await scanner.clear();

      } catch (error) {

        console.log(error);
      }

      kameraAktif = false;
      sedangScan = false;

      document.getElementById("mulai").style.display =
        "block";

      document.getElementById("berhenti").style.display =
        "none";

      document.getElementById("hasil").innerHTML =
        "Kamera dihentikan.<br>" +
        "Tekan MULAI SCAN untuk menggunakan kamera lagi.";
    }

  </script>

</body>
</html>

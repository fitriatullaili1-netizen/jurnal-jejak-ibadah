<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JEJAK IBADAH SANTRI</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f7fa;
      padding: 15px;
      margin: 0;
    }

    h2 {
      margin-bottom: 5px;
    }

    p {
      margin-top: 5px;
    }

    select {
      width: 90%;
      max-width: 400px;
      padding: 12px;
      font-size: 17px;
      margin: 15px auto;
      border-radius: 8px;
      border: 1px solid #ccc;
      display: block;
      background: white;
    }

    button {
      width: 90%;
      max-width: 400px;
      padding: 14px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px auto;
      background: #198754;
      color: white;
    }

    #berhenti {
      background: #dc3545;
      display: none;
    }

    #reader {
      width: 100%;
      max-width: 450px;
      margin: 15px auto;
    }

    #hasil {
      margin: 15px auto;
      padding: 15px;
      max-width: 400px;
      background: white;
      border-radius: 10px;
      font-weight: bold;
      min-height: 20px;
      line-height: 1.6;
    }

    .berhasil {
      color: #198754;
    }

    .gagal {
      color: #dc3545;
    }
  </style>
</head>

<body>

  <h2>JEJAK IBADAH SANTRI</h2>

  <p>Scan QR Code Santri</p>

  <select id="sholat">
    <option value="DHUHA">DHUHA</option>
    <option value="DHUHUR">DHUHUR</option>
  </select>

  <button id="mulai" onclick="mulaiScan()">
    📷 MULAI SCAN
  </button>

  <button id="berhenti" onclick="berhentiScan()">
    ⛔ BERHENTI
  </button>

  <div id="reader"></div>

  <div id="hasil">
    Tekan MULAI SCAN untuk menggunakan kamera.
  </div>


  <script>

    /* =====================================================
       URL GOOGLE APPS SCRIPT
       ===================================================== */

    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycby7QLnTMiKPmGd6irdYazWhShWlkuvmR42zj_UlO0ltYTk7KqYgY-4BJx0JOllwSY5KrA/exec";


    let scanner = null;
    let sedangScan = false;
    let kameraAktif = false;


    /* =====================================================
       MULAI KAMERA
       ===================================================== */

    async function mulaiScan() {

      if (kameraAktif) {
        return;
      }

      document.getElementById("hasil").innerHTML =
        "⏳ Meminta izin kamera...";

      try {

        scanner = new Html5Qrcode("reader");

        await scanner.start(

          {
            facingMode: "environment"
          },

          {
            fps: 10,

            qrbox: {
              width: 250,
              height: 250
            }

          },

          berhasilScan,

          gagalScan

        );


        kameraAktif = true;

        document.getElementById("mulai").style.display = "none";

        document.getElementById("berhenti").style.display = "block";

        document.getElementById("hasil").innerHTML =
          "📷 Kamera siap.<br>Arahkan ke QR santri.";


      } catch (error) {

        console.log("ERROR KAMERA:", error);

        document.getElementById("hasil").innerHTML =
          "❌ Kamera tidak bisa dibuka.<br><br>" +
          "Pastikan izin kamera sudah diberikan.";

        kameraAktif = false;

      }

    }


    /* =====================================================
       QR BERHASIL DIBACA
       ===================================================== */

    function berhasilScan(id) {

      if (sedangScan) {
        return;
      }

      sedangScan = true;

      id = String(id).trim();


      const sholat =
        document.getElementById("sholat").value;


      document.getElementById("hasil").innerHTML =
        "⏳ Memproses ID <b>" +
        id +
        "</b>...";


      /* =================================================
         NAMA CALLBACK
         ================================================= */

      const callbackName =
        "hasil_" + Date.now();


      /* =================================================
         FUNGSI MENERIMA JAWABAN DARI GOOGLE SHEETS
         ================================================= */

      window[callbackName] = function(data) {

        console.log(
          "Jawaban Google Apps Script:",
          data
        );


        if (data && data.sukses === true) {

          document.getElementById("hasil").innerHTML =
            "<div class='berhasil'>" +

            "✅ PRESENSI BERHASIL" +

            "<br><br>" +

            "<b>" +
            data.nama +
            "</b>" +

            "<br>" +

            "ID: " +
            data.id +

            "<br>" +

            "Kelas: " +
            data.kelas +

            "<br>" +

            "Ibadah: " +
            data.sholat +

            "<br>" +

            "Tanggal: " +
            data.tanggal +

            "<br>" +

            "Jam: " +
            data.jam +

            "</div>";


        } else {

          document.getElementById("hasil").innerHTML =
            "<div class='gagal'>" +

            "❌ PRESENSI GAGAL" +

            "<br><br>" +

            (
              data && data.pesan
              ? data.pesan
              : "Jawaban dari Google Sheet tidak valid."
            ) +

            "</div>";

        }


        /* Hapus callback */

        try {
          delete window[callbackName];
        } catch (e) {
          console.log(e);
        }


        /* Tunggu sebelum scan berikutnya */

        setTimeout(function() {

          sedangScan = false;

          document.getElementById("hasil").innerHTML =
            "📷 Silakan scan QR santri berikutnya.";

        }, 2500);

      };


      /* =================================================
         MEMBUAT SCRIPT REQUEST
         ================================================= */

      const script =
        document.createElement("script");


      const url =
        SCRIPT_URL +

        "?id=" +
        encodeURIComponent(id) +

        "&sholat=" +
        encodeURIComponent(sholat) +

        "&callback=" +
        encodeURIComponent(callbackName) +

        "&t=" +
        Date.now();


      console.log(
        "Mengirim ke Google Apps Script:",
        url
      );


      script.src = url;


      /* =================================================
         JIKA GAGAL TERHUBUNG
         ================================================= */

      script.onerror = function(error) {

        console.log(
          "Gagal menghubungi Google Apps Script:",
          error
        );


        document.getElementById("hasil").innerHTML =
          "<div class='gagal'>" +

          "❌ GAGAL TERHUBUNG KE GOOGLE SHEET" +

          "<br><br>" +

          "ID: " +
          id +

          "<br><br>" +

          "Periksa koneksi internet dan Deployment Apps Script."

          + "</div>";


        try {
          delete window[callbackName];
        } catch (e) {
          console.log(e);
        }


        sedangScan = false;

      };


      document.body.appendChild(script);


      /* =================================================
         BATAS WAKTU
         Jika 10 detik tidak ada jawaban
         ================================================= */

      setTimeout(function() {

        if (window[callbackName]) {

          document.getElementById("hasil").innerHTML =
            "<div class='gagal'>" +

            "❌ GOOGLE SHEET TIDAK MEMBERIKAN JAWABAN." +

            "<br><br>" +

            "Silakan periksa koneksi internet."

            + "</div>";


          try {
            delete window[callbackName];
          } catch (e) {
            console.log(e);
          }


          sedangScan = false;

        }

      }, 10000);

    }


    /* =====================================================
       ERROR SCAN QR
       ===================================================== */

    function gagalScan(error) {

      /*
       Tidak menampilkan error
       karena kamera akan terus mencari QR.
      */

    }


    /* =====================================================
       BERHENTI KAMERA
       ===================================================== */

    async function berhentiScan() {

      if (!scanner || !kameraAktif) {
        return;
      }


      try {

        await scanner.stop();

        await scanner.clear();

      } catch (error) {

        console.log(
          "Error menghentikan kamera:",
          error
        );

      }


      kameraAktif = false;

      sedangScan = false;


      document.getElementById("mulai").style.display =
        "block";


      document.getElementById("berhenti").style.display =
        "none";


      document.getElementById("hasil").innerHTML =
        "Kamera dihentikan.<br>" +
        "Tekan MULAI SCAN untuk menggunakan kamera lagi.";

    }

  </script>

</body>
</html>

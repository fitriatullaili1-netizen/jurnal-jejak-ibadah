<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JEJAK IBADAH SANTRI</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f7fa;
      padding: 15px;
      margin: 0;
    }

    h2 {
      margin-bottom: 5px;
    }

    p {
      margin-top: 5px;
    }

    select {
      width: 90%;
      max-width: 400px;
      padding: 12px;
      font-size: 17px;
      margin: 15px auto;
      border-radius: 8px;
      border: 1px solid #ccc;
      display: block;
    }

    button {
      width: 90%;
      max-width: 400px;
      padding: 14px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px auto;
      background: #198754;
      color: white;
    }

    #berhenti {
      background: #dc3545;
      display: none;
    }

    #reader {
      width: 100%;
      max-width: 450px;
      margin: 15px auto;
    }

    #hasil {
      margin: 15px auto;
      padding: 15px;
      max-width: 400px;
      background: white;
      border-radius: 10px;
      font-weight: bold;
      min-height: 20px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <h2>JEJAK IBADAH SANTRI</h2>

  <p>Scan QR Code Santri</p>

  <select id="sholat">
    <option value="DHUHA">DHUHA</option>
    <option value="DHUHUR">DHUHUR</option>
  </select>

  <button id="mulai" onclick="mulaiScan()">
    📷 MULAI SCAN
  </button>

  <button id="berhenti" onclick="berhentiScan()">
    ⛔ BERHENTI
  </button>

  <div id="reader"></div>

  <div id="hasil">
    Tekan MULAI SCAN untuk menggunakan kamera.
  </div>

  <script>

    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycby7QLnTMiKPmGd6irdYazWhShWlkuvmR42zj_UlO0ltYTk7KqYgY-4BJx0JOllwSY5KrA/exec";

    let scanner = null;
    let sedangScan = false;
    let kameraAktif = false;


    async function mulaiScan() {

      if (kameraAktif) return;

      document.getElementById("hasil").innerHTML =
        "Meminta izin kamera...";

      try {

        scanner = new Html5Qrcode("reader");

        await scanner.start(
          {
            facingMode: "environment"
          },
          {
            fps: 10,
            qrbox: {
              width: 250,
              height: 250
            }
          },
          berhasilScan,
          gagalScan
        );

        kameraAktif = true;

        document.getElementById("mulai").style.display = "none";
        document.getElementById("berhenti").style.display = "block";

        document.getElementById("hasil").innerHTML =
          "Kamera siap.<br>Arahkan ke QR santri.";

      } catch (error) {

        console.log(error);

        document.getElementById("hasil").innerHTML =
          "Kamera tidak bisa dibuka.<br><br>" +
          "Pastikan izin kamera sudah diberikan.";

        kameraAktif = false;
      }
    }


    function berhasilScan(id) {

      if (sedangScan) return;

      sedangScan = true;

      id = id.trim();

      const sholat =
        document.getElementById("sholat").value;

      document.getElementById("hasil").innerHTML =
        "⏳ Memproses ID " + id + "...";


      const callbackName =
        "hasil_" + Date.now();


      window[callbackName] = function(data) {

        console.log("Jawaban Google Sheet:", data);

        if (data.sukses === true) {

          document.getElementById("hasil").innerHTML =
            "✅ PRESENSI BERHASIL<br><br>" +
            "<b>" + data.nama + "</b><br>" +
            "ID: " + data.id + "<br>" +
            "Kelas: " + data.kelas + "<br>" +
            "Ibadah: " + data.sholat + "<br>" +
            "Tanggal: " + data.tanggal + "<br>" +
            "Jam: " + data.jam;

        } else {

          document.getElementById("hasil").innerHTML =
            "❌ PRESENSI GAGAL<br><br>" +
            data.pesan;
        }


        delete window[callbackName];


        setTimeout(function() {

          sedangScan = false;

          document.getElementById("hasil").innerHTML =
            "📷 Silakan scan QR santri berikutnya.";

        }, 2500);

      };


      const script =
        document.createElement("script");


      script.src =
        SCRIPT_URL +
        "?id=" +
        encodeURIComponent(id) +
        "&sholat=" +
        encodeURIComponent(sholat) +
        "&callback=" +
        encodeURIComponent(callbackName);


      script.onerror = function() {

        document.getElementById("hasil").innerHTML =
          "❌ Tidak dapat menerima jawaban dari Google Sheet.<br><br>" +
          "ID: " + id;

        delete window[callbackName];

        sedangScan = false;
      };


      document.body.appendChild(script);

    }


    function gagalScan(error) {
      // Tidak menampilkan pesan error scan
    }


    async function berhentiScan() {

      if (!scanner || !kameraAktif) return;

      try {

        await scanner.stop();

        await scanner.clear();

      } catch (error) {

        console.log(error);

      }


      kameraAktif = false;

      document.getElementById("mulai").style.display = "block";
      document.getElementById("berhenti").style.display = "none";

      document.getElementById("hasil").innerHTML =
        "Kamera dihentikan.<br>" +
        "Tekan MULAI SCAN untuk menggunakan kamera lagi.";

    }

  </script>

</body>
</html>
